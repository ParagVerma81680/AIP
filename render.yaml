services:
  - type: web
    name: AIP
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: PYTHONPATH
        value: backend
